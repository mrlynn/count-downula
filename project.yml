name: Countdownula

options:
  bundleIdPrefix: com.countdownula
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    watchOS: "10.0"
    iOS: "17.0"
    tvOS: "18.0"

settings:
  base:
    DEVELOPMENT_TEAM: YZ36Z8GSEN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Text the apps show comes from Resources/Localizable.xcstrings (see scripts/sync-strings.sh).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # macOS menu bar app
  Countdownula:
    type: application
    platform: macOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/Countdownula
      - Sources/Shared
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/MenuBarIcon.png
        buildPhase: resources
      - path: Resources/MenuBarIcon@2x.png
        buildPhase: resources
      - path: Resources/Mac/en.lproj
        buildPhase: resources
    dependencies:
      - target: CountdownulaMacWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app
        # The Mac App Store build: sandboxed, with the free tier and the Unlimited purchase.
        # scripts/release-mac.sh builds the GitHub download instead, overriding these two settings with
        # DIRECT_DISTRIBUTION (always unlocked, no StoreKit) and Resources/CountdownulaDirect.entitlements.
        # The override goes through MAC_APP_ENTITLEMENTS so it reaches only this target: the widget
        # extension must stay sandboxed in both builds.
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        MAC_APP_ENTITLEMENTS: Resources/Countdownula.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MAC_APP_ENTITLEMENTS)
        ARCHS: "$(ARCHS_STANDARD)"
    entitlements:
      path: Resources/Countdownula.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Live links, shared countdowns and the Crypt.
        com.apple.security.network.client: true
        # Photos chosen in the editor's open panel or dropped on it.
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.countdownula.app]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
        # Shares the countdown snapshot with the desktop widgets (SharedConfig.appGroup).
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.countdownula.app]
        # From Calendar reads upcoming events on the Mac (the user is asked first).
        com.apple.security.personal-information.calendars: true

  # Apple TV (5.9): your countdowns through iCloud and the Crypt, each one full screen. Shares the
  # iPhone app's bundle ID so Unlimited is one universal purchase.
  CountdownculaTV:
    type: application
    platform: tvOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownculaTV
      - Sources/Shared
    dependencies:
      - target: CountdownculaTVTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app
        PRODUCT_NAME: Countdowncula
        PRODUCT_MODULE_NAME: CountdownculaTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Count Downcula
        CODE_SIGN_ENTITLEMENTS: Resources/TV/CountdownculaTV.entitlements
    info:
      path: Resources/TV/Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        # The Top Shelf opens countdowns with countdownula://countdown/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.countdownula.app
            CFBundleURLSchemes: [countdownula]
    entitlements:
      path: Resources/TV/CountdownculaTV.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.countdownula.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.application-groups: [group.com.countdownula.app]

  CountdownculaTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownculaTVTopShelf
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.topshelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Count Downcula
        CODE_SIGN_ENTITLEMENTS: Resources/TV/CountdownculaTVTopShelf.entitlements
        SKIP_INSTALL: YES
    info:
      path: Resources/TV/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: Resources/TV/CountdownculaTVTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.countdownula.app]

  # The screensaver (5.9 spike). Ships only with the GitHub build: the Mac App Store doesn't take
  # screensavers. Runs inside Apple's legacyScreenSaver host and reads the copy of the countdowns
  # the GitHub build mirrors into that host's container (SaverSnapshot).
  CountdownculaSaver:
    type: bundle
    platform: macOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownculaSaver
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/SaverSnapshot.swift
      - path: Sources/Shared/PresentView.swift
      - path: Sources/Shared/ConfettiView.swift
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/StyleViews.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
    settings:
      base:
        PRODUCT_NAME: Count Downcula
        PRODUCT_BUNDLE_IDENTIFIER: com.countdowncula.saver
        PRODUCT_MODULE_NAME: CountdownculaSaver
        WRAPPER_EXTENSION: saver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: CountdownculaSaver.CountdownculaSaverView
        INFOPLIST_KEY_CFBundleDisplayName: Count Downcula
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  # Desktop and Notification Center widgets for the Mac app.
  CountdownulaMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaMacWidgets
      - Sources/CountdownulaWidgets
      - path: Sources/CountdownulaiOSWidgets/HomeWidgetViews.swift
      - path: Sources/CountdownulaiOSWidgets/UpNextWidget.swift
      - path: Sources/PhoneShared/WidgetIntents.swift
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/StyleViews.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.macwidgets
        CODE_SIGN_ENTITLEMENTS: Resources/Mac/CountdownulaMacWidgets.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: Resources/Mac/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Resources/Mac/CountdownulaMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.countdownula.app]

  # watchOS app. Ships inside the iPhone app but runs on its own (no iPhone needed at runtime).
  CountdownulaWatch:
    type: application
    platform: watchOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaWatch
      - Sources/Shared
      - Sources/CountdownulaWidgets/ComplicationViews.swift
      - Resources/Watch/Assets.xcassets
      - path: Resources/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: CountdownulaWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.watchkitapp
        PRODUCT_NAME: Countdownula
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Count Downcula
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.countdownula.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Watch/CountdownulaWatch.entitlements
    info:
      path: Resources/Watch/Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.countdownula.app
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Resources/Watch/CountdownulaWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.countdownula.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.application-groups: [group.com.countdownula.app]

  # Complications (WidgetKit)
  CountdownulaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaWidgets
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/StyleViews.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: Resources/Watch/CountdownulaWatchWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: Resources/Watch/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Resources/Watch/CountdownulaWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.countdownula.app]

  # iPhone / iPad app. Same bundle ID as the Mac app so the two can share an App Store record.
  CountdownulaiOS:
    type: application
    platform: iOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaiOS
      - Sources/Shared
      - Sources/PhoneShared
      # Localized permission prompts.
      - Resources/iOS/InfoPlist.xcstrings
      - Resources/iOS/Assets.xcassets
      - path: Resources/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Share Analytics and Reset Analytics ID, in the Settings app.
      - path: Resources/iOS/Settings.bundle
        buildPhase: resources
      # The Count's final ten seconds (NotificationPlan.finalCountdownSound).
      - path: Resources/iOS/Sounds/count-final-10.caf
        buildPhase: resources
    dependencies:
      - target: CountdownulaiOSWidgets
      - target: CountdownulaWatch
      - target: CountdownulaClip
      - target: CountdownulaShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app
        PRODUCT_NAME: Countdownula
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/Countdownula.entitlements
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.countdownula.app.refresh-shared]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.countdownula.app
            CFBundleURLSchemes: [countdownula]
        # Lets debug builds reach a live link server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: Count Downcula uses your rough location to work out when the sun rises and sets for your sunrise and sunset countdowns.
        NSCalendarsFullAccessUsageDescription: Count Downcula shows your upcoming events so you can pick the ones to count down to. Events stay on your iPhone; only the countdowns you add sync.
        LSApplicationQueriesSchemes: [instagram-stories]
        # Meta requires a Facebook app ID for Instagram Stories sharing. Empty hides the option.
        FacebookAppID: ""
    entitlements:
      path: Resources/iOS/Countdownula.entitlements
      properties:
        # Shared countdown links open in the app (served by server/src/app/.well-known).
        com.apple.developer.associated-domains: [applinks:go.countdowncula.com, appclips:go.countdowncula.com]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.countdownula.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.application-groups: [group.com.countdownula.app]

  # App Clip: opens shared countdown links on devices without the app. Apple requires a clip to
  # support the same devices as its parent, so it runs on iPad too.
  CountdownulaClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaClip
      - Sources/CountdownulaiOS/TimeBlocks.swift
      - Resources/iOS/Assets.xcassets
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/StyleViews.swift
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
      - path: Sources/Shared/SharedCountdowns.swift
      - path: Sources/Shared/LiveLinkAPI.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/ImageUpdate.swift
      - path: Sources/Shared/ClipHandoff.swift
      - path: Sources/Shared/Analytics.swift
      - path: Sources/Shared/Recap.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.Clip
        PRODUCT_NAME: CountdownulaClip
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/Clip/CountdownulaClip.entitlements
    info:
      path: Resources/Clip/Info.plist
      properties:
        CFBundlePackageType: APPL
        CFBundleDisplayName: Count Downcula
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad multitasking needs every orientation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        # Lets debug builds reach a live link server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/Clip/CountdownulaClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers: [$(AppIdentifierPrefix)com.countdownula.app]
        com.apple.developer.associated-domains: [appclips:go.countdowncula.com]
        com.apple.security.application-groups: [group.com.countdownula.app]

  # "Count Downcula" in the share sheet: a ticket, invite or screenshot becomes a countdown.
  CountdownulaShare:
    type: app-extension
    platform: iOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaShare
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/StyleViews.swift
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/CountdownDraft.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Resources/Share/CountdownulaShare.entitlements
        SKIP_INSTALL: YES
    info:
      path: Resources/Share/Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Resources/Share/CountdownulaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.countdownula.app]

  # Home Screen, Lock Screen and StandBy widgets, plus the Live Activity
  CountdownulaiOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Resources/Localizable.xcstrings
      - Sources/CountdownulaiOSWidgets
      - Sources/CountdownulaWidgets
      - Sources/PhoneShared
      - path: Sources/Shared/Countdown.swift
      - path: Sources/Shared/SharedConfig.swift
      - path: Sources/Shared/Localization.swift
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Sources/Shared/FangMark.swift
      - path: Sources/Shared/CountdownStyle.swift
      - path: Sources/Shared/Scenes.swift
      - path: Sources/Shared/StyleViews.swift
      - path: Sources/Shared/Milestone.swift
      - path: Sources/Shared/CountdownExtras.swift
      - path: Sources/Shared/CountUnits.swift
      - path: Sources/Shared/Astronomy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/CountdownulaWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: Resources/iOS/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Count Downcula
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Resources/iOS/CountdownulaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.countdownula.app]

  # Unit tests for the platform-neutral model code in Sources/Shared.
  CountdownulaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Shared
      - Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countdownula.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

schemes:
  Countdownula:
    build:
      targets:
        Countdownula: all
    run:
      config: Debug
      commandLineArguments:
        "-seedDemo": false
        "-openPopover": false
        "-localOnly": false
    archive:
      config: Release
  CountdownulaWatch:
    build:
      targets:
        CountdownulaWatch: all
    run:
      config: Debug
      # Local StoreKit testing for the Unlimited purchase (Debug > StoreKit > Manage Transactions).
      storeKitConfiguration: Resources/Countdownula.storekit
      commandLineArguments:
        "-seedDemo": false
        "-complicationGallery": false
        "-localOnly": false
    archive:
      config: Release
  CountdownulaiOS:
    build:
      targets:
        CountdownulaiOS: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Countdownula.storekit
      commandLineArguments:
        "-seedDemo": false
        "-localOnly": false
        "-initializeCloudKitSchema": false
    archive:
      config: Release
  CountdownulaTests:
    build:
      targets:
        CountdownulaTests: [test]
    test:
      targets:
        - CountdownulaTests
